
name: Build PiBank APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and build PiBank
        run: |
          SETTINGS_FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" assembleDebug

          APK_PATH=$(find "$PROJECT_DIR" -type f -name app-debug.apk -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/PiBank-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiBank-debug-apk
          path: PiBank-debug.apk
          
